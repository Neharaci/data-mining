services:
  postgres:
    image: postgres:16
    container_name: annapurna-postgres
    environment:
      POSTGRES_USER: annapurna
      POSTGRES_PASSWORD: annapurna
      POSTGRES_DB: annapurna
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: annapurna-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  duckdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: annapurna-duckdb
    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data: